[package]
name = "forge-cli"
version = "0.4.0"
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/N4M3Z/forge-cli"
description = "Forge module toolkit — assemble, validate, and deploy skills, agents, and rules across AI coding providers"

[lib]
name = "commands"
path = "src/commands.rs"

[[bin]]
name = "forge"
path = "src/main.rs"

[features]
default = ["full"]
full = ["assemble", "validate", "deploy"]
assemble = []
validate = ["dep:rust-embed"]
deploy = []
embed = ["dep:rust-embed"]
dashboard = ["full", "dep:axum", "dep:tokio", "dep:askama", "dep:tower-http", "dep:open"]
tui = ["dep:ratatui", "dep:crossterm", "dep:syntect", "dep:ansi-to-tui", "dep:unicode-width"]

[dependencies]
# cli
clap = { version = "4", features = ["derive"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# crypto
sha2 = "0.10"

# time
chrono = "0.4"

# utils
regex = "1"
console = "0.15"
dirs = "6"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# git
gix = { version = "0.66", default-features = false, features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation"] }

# optional
rust-embed = { version = "8", optional = true }
jsonschema = { version = "0.46.0", default-features = false }

# dashboard (optional, excluded from full)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt", "net", "macros"], optional = true }
askama = { version = "0.13", features = ["urlencode"], optional = true }
tower-http = { version = "0.6", features = ["set-header"], optional = true }
open = { version = "5", optional = true }

# tui (optional, excluded from full)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }
ansi-to-tui = { version = "8.0.1", optional = true }
unicode-width = { version = "0.2", optional = true }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = ["cfg(ci)", "cfg(feature, values(\"dashboard\", \"tui\"))"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
implicit_hasher = "allow"

[profile.release]
strip = true
lto = true
