providers:
    claude:
        target: ".claude"

    gemini:
        target: ".gemini"
        assembly:
            - kebab-case-agents
            - remap-tools

    agentskills:
        target: ".agents"
        aliases:
            - agents
        assembly:
            - strip-links
        keep_fields:
            agents: [name, description]
            skills: [name, description, license, compatibility, metadata, allowed-tools]
            rules: []

    codex:
        target: ".codex"
        assembly:
            - agents-to-toml
        deploy:
            - rulesync
        effort:
            strong: medium
            fast: low
            light: low

    opencode:
        target: ".opencode"
        assembly:
            - kebab-case-agents
